# Owner(s): ["module: rocm"]
# Unneeded for CI: trunk.yml covers the same ROCm testing.
# Kept in-repo for metrics; auto-triggers below are commented out.
# workflow_dispatch remains for manual runs.
name: rocm-mi350

on:
  # DEBUG: temporarily enabled to triage gfx950 CUDA-context poisoning in
  # test_fake_tensor. DO NOT MERGE.
  push:
    tags:
      - ciflow/rocm-mi350/*
  workflow_dispatch:
  #schedule:
  #  - cron: 29 8 * * *  # about 1:29am PDT

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  # DEBUG: get-label-type (runner-determinator) and target-determination removed
  # so a dispatch doesn't wait on GitHub-hosted ubuntu-latest. The runner is
  # hardcoded to the amd-do gfx950 pool below, and tests-to-include makes
  # target-determination unnecessary.
  # DEBUG: no build job. The test downloads a prebuilt trunk wheel from S3 (see
  # _rocm-test.yml "Download build artifacts"), so a dispatch is just the gfx950
  # test job -- no compile, no build runner. DO NOT MERGE.
  linux-noble-rocm-py3_12-test:
    if: github.repository_owner == 'pytorch'
    name: linux-jammy-rocm-py3.10-mi350
    uses: ./.github/workflows/_rocm-test.yml
    with:
      build-environment: linux-jammy-rocm-py3.10-mi350
      docker-image: ci-image:pytorch-linux-jammy-rocm-n-py3
      test-matrix: |
        { include: [
          { config: "default", shard: 1, num_shards: 1, runner: "amd-do-linux.rocm.gpu.gfx950.1" },
        ]}
      # DEBUG: only run the test file with the context-poisoning fault.
      tests-to-include: "test_fake_tensor"
    secrets: inherit
